[project]
name = "particle-sim"
version = "0.1.0"
description = "2.5D probabilistic particle defect simulator (geometry contact risk, critical area)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "pillow",
    "tifffile",
    "zarr",
    "numcodecs",
    "matplotlib",
    "scikit-image",
    "pyarrow",
]

[project.scripts]
particle-sim = "particle_sim.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/particle_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Korean user-facing messages make E501 noisy; formatting still targets 100 columns.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["particle_sim"]
