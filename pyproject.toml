[project]
name = "particle-sim"
version = "0.1.0"
description = "2.5D probabilistic particle defect simulator (geometry contact risk, critical area)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "numcodecs>=0.13,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pillow>=10,<13",
    "psutil>=6,<8",
    "pyarrow>=16,<26",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "scikit-image>=0.24,<1",
    "scipy>=1.13,<2",
    "tifffile>=2024.1.30",
    "tqdm>=4.66,<5",
    "zarr>=3,<4",
]

[project.scripts]
particle-sim = "particle_sim.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/particle_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Korean user-facing messages make E501 noisy; formatting still targets 100 columns.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["particle_sim"]
