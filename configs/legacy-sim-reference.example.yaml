# 이 파일을 작업 폴더로 복사하고 실제 기존 sim의 모든 공통 조건을 채운다.
schema_version: "2.0"
# 기존 sim과 비교할 particle-sim 실행이 같은 제품·설계·mask를 썼는지 확인한다.
product_id: PRODUCT_EXAMPLE
design_version: V01
# 기존 sim이 사용한 mask 파일의 sha256. 키는 제품 manifest의 상대 경로이며
# run_manifest.json input_hashes의 모든 mask(manifest·scenario 제외)를 빠짐없이 적고
# 값이 모두 같아야 한다.
input_hashes:
  masks/layer_M2.png: replace-with-sha256
  masks/electrode_D1.png: replace-with-sha256
  masks/electrode_D2.png: replace-with-sha256
axes: yx
origin: upper_left
pixel_size_x_um: 0.5
pixel_size_y_um: 0.5
particle_size_definition: diameter

# path는 이 YAML이 있는 폴더를 기준으로 하며 .npy/.tif/.tiff 2-D 이진 배열만 허용한다.
# 기존 sim에 존재하는 failure_unit_id를 하나라도 적었다면 그 단위의 모든 source step과
# particle size record가 있어야 한다(적용 공정이 아닌 조건은 제외).
# 기존 sim에 없던 전극 조합은 new_pair, open·CNO 단위는 new_unit이 된다.
records:
  - source_step: S_M1
    particle_size_um: 2.0
    failure_unit_id: D1__D2
    path: arrays/S_M1__D2um__D1__D2.npy
