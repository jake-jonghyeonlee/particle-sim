# 이 파일을 작업 폴더로 복사하고 실제 기존 sim의 모든 공통 조건을 채운다.
schema_version: "1.0"
axes: yx
origin: upper_left
pixel_size_x_um: 0.5
pixel_size_y_um: 0.5
particle_size_definition: diameter

# path는 이 YAML이 있는 폴더를 기준으로 하며 .npy/.tif/.tiff 2-D 이진 배열만 허용한다.
# 기존 sim에 존재하는 failure_unit_id를 하나라도 적었다면 그 단위의 모든 source step과
# particle size record가 있어야 한다. 기존 sim에 없던 단위는 적지 않으며 결과에서 new_pair가 된다.
records:
  - source_step: S_M1
    particle_size_um: 2.0
    failure_unit_id: D1__D2
    path: arrays/S_M1__D2um__D1__D2.npy
